apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
clientConnection:
  kubeconfig: /etc/kubernetes/scheduler.conf
profiles:
- schedulerName: gpusched-scheduler
  plugins:
    filter:
      enabled:
      - name: GPUFit
    score:
      enabled:
      - name: GPUFit
        weight: 10